<svg viewBox="0 0 960 280" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Abhishek Rai — software engineer" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1220"/>
      <stop offset="100%" stop-color="#101B33"/>
    </linearGradient>
    <filter id="glow" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="fade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="18%" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="1"/>
    </linearGradient>
    <mask id="routeMask">
      <rect x="0" y="0" width="960" height="280" fill="url(#fade)"/>
    </mask>
  </defs>

  <rect x="0" y="0" width="960" height="280" rx="18" fill="url(#bg)"/>

  <g mask="url(#routeMask)">
    <path id="route" d="M 60,210 C 155,210 155,165 250,165 C 355,165 355,215 460,215 C 565,215 565,155 670,155 C 775,155 775,200 880,200"
          fill="none" stroke="#3FD0C9" stroke-width="1.6" stroke-linecap="round" opacity="0.45"/>

    <circle cx="60" cy="210" r="4.5" fill="#3FD0C9">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="250" cy="165" r="4.5" fill="#3FD0C9">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="3.2s" begin="0.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="460" cy="215" r="4.5" fill="#3FD0C9">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="3.2s" begin="1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="670" cy="155" r="4.5" fill="#3FD0C9">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="3.2s" begin="1.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="880" cy="200" r="4.5" fill="#3FD0C9">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="3.2s" begin="2s" repeatCount="indefinite"/>
    </circle>

    <circle r="4" fill="#FFB454" filter="url(#glow)">
      <animateMotion dur="5.5s" repeatCount="indefinite" rotate="auto">
        <mpath href="#route"/>
      </animateMotion>
    </circle>
    <circle r="4" fill="#FFB454" filter="url(#glow)" opacity="0.6">
      <animateMotion dur="5.5s" begin="2.75s" repeatCount="indefinite" rotate="auto">
        <mpath href="#route"/>
      </animateMotion>
    </circle>
  </g>

  <text x="56" y="118" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="40" font-weight="700" fill="#E6EDF3">Abhishek Rai</text>
  <text x="56" y="150" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#8B98A5">Software engineer building optimization tools, ML systems, and computer-vision apps.</text>
</svg>
